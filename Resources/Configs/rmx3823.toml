#
# realme GT5 240W (RMX3823) - SM8550 / kalama
#
# Modelled on qrd8550.toml (same SoC reference), with the boot image format
# taken from nuwa.toml because that is the only SM8550 *phone* in this tree
# that is empirically known to boot:
#
#   header_version = 1
#
# Rationale: this port boots via BootShim, which places a stub kernel in the
# Android boot image's kernel slot. Header v1/v2 have that slot at a fixed
# offset; v3/v4 set kernel_size = 0 and expect the payload in the ramdisk
# instead, which does not match the BootShim layout.
#
# If the RMX3823 ABL rejects the image, try header_version = 3 or 4 - but do
# that only after confirming the failure is at boot image parse time (device
# falls straight back to fastboot / shows nothing), not later during DXE.
#

#
# Boot Shim Configs
#
[boot_shim]
requires_kernel_header = true

#
# UEFI FD Configs
#
# Must match the "UEFI FD" entry in
# Platforms/Qualcomm/rmx3823Pkg/Library/MemoryMapLib/MemoryMapLib.c
# (0xA8000000, 0x00400000). blocks is derived as size / 4096 by build_uefi.py.
#
# UNIXNU LOCAL CHANGE (fork of Janit8r/uefi-rmx3823, branch unixnu/gt5-minimal):
# the upstream author placed the FD at 0xA7000000, mirroring the stock XBL
# carveout (stock uefi.elf, a 3 MiB ELF, is loaded there by XBL). However this
# port does NOT go through XBL's uefi_a loading path - it boots via
# `fastboot boot`, where ABL decompresses the boot-image kernel to kernel_addr
# and BootShim relocates the FD to FD_BASE. An independently built image that
# ran its firmware at 0xA8000000 (boot-gt5-v0smoke31.img, kernel_addr
# 0xA8000000) is the only variant observed to reach a working display on real
# RMX3823 hardware; every 0xA7000000-based attempt stopped at the ABL splash.
# So the whole UEFI FD block (0xA7000000..0xA8000000, exactly 16 MiB in the
# MemoryMapLib map) is shifted up by 16 MiB to 0xA8000000..0xA9000000:
#   - "UEFI FD" block + all derived regions (FD Reserved, CPU Vectors,
#     Info Blk, MMU PageTables, Log Buffer, UEFI Stack, SEC Heap, Sched Heap,
#     FV Region, UEFI RESV) move +0x01000000;
#   - "Kernel" reservation moves from 0xA8000000/0x10000000 to
#     0xA9000000/0x0F000000 so it ends exactly at Display Reserved
#     (0xB8000000) - the kernel window shrinks from 256 MiB to 240 MiB;
#   - Display Reserved (0xB8000000) and everything below 0xA8000000 is
#     untouched.
# Size stays 0x400000 (4 MiB), same headroom layout as upstream.
#
[uefi_fd]
base = 0xA7000000
size = 0x400000

#
# Android Boot Image Kernel Configs
#
# append_dtb = false on purpose:
#   Resources/DTBs/rmx3823.dtb does not exist yet - the real board DT has to be
#   dumped from the running device (/sys/firmware/fdt) or decompiled out of the
#   stock boot.img. dtbo.img only carries overlays, so it cannot supply it.
#
#   Leaving it false is also the more correct behaviour for a UniXNU target:
#   XNU gets its ADT from the engine compiling the device repo's dts/board.dts,
#   not from this blob. At runtime UEFI picks up the board DT that XBL already
#   publishes in the "XBL DT" carveout (0x81A00000), which is authoritative.
#
#   Only flip this back to true if you actually want the Mu-Silicium/Linux
#   behaviour of embedding a DT next to the UEFI FD.
#
[boot_image_kernel]
kernel_compression = "gzip"
append_dtb         = false

#
# Android Boot Image Configs
#
# Every field is spelled out even though these are the engine's defaults
# (unixnu/bootimg.py DEFAULTS), because Mu-Silicium's own build_uefi.py takes
# its defaults from Resources/Scripts/mkbootimg.py instead, which are different:
#
#   engine          base 0x0, kernel_offset 0x8000, tags_offset 0x1E00000, pagesize 4096
#   mkbootimg.py    base 0x10000000, kernel_offset 0x8000, pagesize 2048
#
# Left implicit, the two build paths produce boot images with different load
# addresses - and mkbootimg.py's 0x10008000 is not even in SM8550's DDR, which
# starts at 0x80000000. Spelling them out makes both paths agree.
#
# The values match sheng.toml, the only SM8550 board in this tree that is known
# to boot through BootShim. BootShim is position independent (it copies itself
# and the firmware volume to FD_BASE from its own PC-relative address), so the
# kernel load address only has to be reachable RAM large enough for the shim
# plus the 3 MiB volume.
#
# header_version = 1: v1/v2 keep the kernel slot at a fixed offset, which is
# what the BootShim payload layout expects. v3/v4 set kernel_size = 0 and expect
# the payload in the ramdisk instead.
#
[boot_image]
header_version = 1
base           = 0x00000000
kernel_offset  = 0x00008000
tags_offset    = 0x01E00000
pagesize       = 4096
